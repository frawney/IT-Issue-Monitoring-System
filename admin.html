<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4562cd">
<meta name="color-scheme" content="light">
<title>Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234562cd'/%3E%3Crect x='14' y='33' width='9' height='17' rx='3' fill='%23fff'/%3E%3Crect x='27.5' y='15' width='9' height='35' rx='3' fill='%23fff'/%3E%3Crect x='41' y='25' width='9' height='25' rx='3' fill='%23f9b872'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#fdf8ec;--card:#fff;--tx:#1d2552;--mut:#5f6585;--line:#e7e3ef;--soft:#f1eee3;
  --pri:#5274da;--priTx:#fff;--org:#f9b872;--red:#dc505d;--err:#c23a47;
  --note:#fff1d6;--sh:0 1px 2px rgba(29,37,82,.05),0 10px 26px -10px rgba(69,98,205,.2);--sh2:0 2px 4px rgba(29,37,82,.06),0 18px 34px -12px rgba(69,98,205,.34);
  --hdr:#4562cd;--priT:#3d5fc9;--track:#ece7d8;--deco:.6;
  --c-Baru:#dc505d;--bg-Baru:#fde4e6;--tx-Baru:#b3303d;
  --c-Diproses:#f9b872;--bg-Diproses:#fdeed6;--tx-Diproses:#935510;
  --c-Selesai:#3fb68b;--bg-Selesai:#dcf4ea;--tx-Selesai:#1d7656;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Mulish",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.sub{color:var(--mut);font-size:13px}
.pgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e6e1d2}
.pgrow:last-of-type{border-bottom:0}
.pgrow b{font-weight:700;word-break:break-word}
.pgadd{display:flex;gap:8px;margin-top:12px}
.pgadd .btn{width:auto;flex:none;padding-left:20px;padding-right:20px}
.ms{position:relative}
.ms>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:11px 14px;border:1.5px solid #a39c88;border-radius:14px;background:#fffdf8;color:var(--tx);cursor:pointer}
.ms>summary::-webkit-details-marker{display:none}
.ms>summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-4px;flex:none}
.ms[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.ms>summary:focus-visible{outline:0;border-color:var(--priT);box-shadow:0 0 0 3px rgba(58,88,192,.2)}
.ms-ph{color:#6b7189}
.ms-list{margin-top:6px;border:1.5px solid #a39c88;border-radius:14px;background:#fffdf8;max-height:220px;overflow:auto;padding:6px}
.ms-list label{display:flex;align-items:center;gap:10px;padding:10px;margin:0;border-radius:10px;cursor:pointer;font-weight:600}
.ms-list label:hover{background:#f3f6ff}
.ms-list input{width:20px;height:20px;min-height:0;flex:none;margin:0;padding:0;accent-color:var(--priT)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* ---------- blue header with soft curves ---------- */
header.top{position:relative;z-index:1;color:#fff;overflow:hidden;
  background:radial-gradient(120% 150% at 100% 0%,#5b7ce4 0%,rgba(91,124,228,0) 55%),linear-gradient(160deg,#4b69d5,#3c58c1);
  border-radius:0 0 34px 34px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 0 92px}
header.top::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.22) 1.3px,transparent 1.7px);background-size:20px 20px;-webkit-mask-image:linear-gradient(to left,#000 0,transparent 55%);mask-image:linear-gradient(to left,#000 0,transparent 55%)}
.vr{flex:none;align-self:stretch;width:2px;margin:6px 0;border-radius:2px;background:rgba(255,255,255,.4)}
header.top .deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hd{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{flex:none;height:60px;min-width:60px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px 10px;box-shadow:0 4px 14px rgba(29,37,82,.22)}
.logo img{display:block;height:100%;width:auto;max-width:min(190px,34vw);object-fit:contain}
.logo.dark{background:rgba(14,20,64,.5);box-shadow:none}
@media (min-width:700px){.logo{height:76px;min-width:76px;border-radius:22px;padding:8px 14px}}
.hd small{display:block;font-size:15px;font-weight:700}
.hd h1,.hd small,.hd .tag{text-shadow:0 1px 3px rgba(10,20,80,.35)}
.hd h1{font-size:clamp(26px,5vw,40px);font-weight:800;line-height:1.15;letter-spacing:-.01em}
.hd .tag{display:none;font-size:13.5px;font-weight:600;margin-top:4px;max-width:46ch}

/* ---------- navigation: floating bar on phones, pills on desktop ---------- */
#nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;
  display:flex;gap:4px;background:var(--card);border-radius:28px;padding:6px;box-shadow:0 10px 30px rgba(29,37,82,.22);max-width:520px;margin:0 auto}
#nav:empty{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--mut);
  font-size:12px;font-weight:700;line-height:1.2;padding:9px 6px;border-radius:22px;cursor:pointer;min-height:52px}
#nav button.on{color:var(--priT);background:rgba(82,116,218,.16)}
#nav svg{width:22px;height:22px}
#nav span{white-space:nowrap}
svg.i,#nav svg,.ic svg,.lnk svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{position:relative;z-index:2;margin-top:-62px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:17px;font-weight:800}
.card h3{font-size:14px;font-weight:800;margin:18px 0 4px}
.note{padding:12px 14px;border-radius:16px;background:var(--note);font-size:13.5px;margin-bottom:14px}
.grid2{display:grid;gap:14px}
.grid2>.card{margin-bottom:0}
.grid2{margin-bottom:14px}
.total{display:flex;align-items:center;justify-content:space-between;gap:12px}
.total b{display:block;font-size:19px;font-weight:800;line-height:1.3;margin:4px 0}
.total .big{font-size:40px;line-height:1;font-weight:800;color:var(--priT)}
.ct{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.rings{display:flex;justify-content:space-around;gap:8px}
.rg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.rg b{font-size:14px;font-weight:800}
.rg small{font-size:12px;font-weight:600;color:var(--mut);margin-top:-4px}
.ring{--p:0;--c:var(--pri);width:66px;height:66px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--track) 0)}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-size:19px;font-weight:800}

/* segmented filter */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 4px 10px}
.sec h2{font-size:17px;font-weight:800}
.lnk{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--priT);font-weight:800;font-size:14px;cursor:pointer;padding:6px 4px}
.lnk svg{width:18px;height:18px}
.lnk:disabled{opacity:.6;cursor:default}
.seg{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;box-shadow:var(--sh);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--priT);font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--priTx)}
.seg em{font-style:normal;font-size:12px;font-weight:800;margin-left:6px;padding:1px 8px;border-radius:999px;background:rgba(82,116,218,.14)}
.seg button[aria-pressed="true"] em{background:rgba(255,255,255,.28)}

/* report rows */
.list{display:grid;gap:10px}
.item{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:14px 14px 14px 20px;box-shadow:var(--sh);cursor:pointer;min-width:0}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.item:hover{box-shadow:var(--sh2)}
.item .mid{min-width:0}
.item .mid b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.item .mid .ur{margin:0 0 7px;padding:8px 12px;border-radius:12px;background:var(--b);background:color-mix(in srgb,var(--b) 50%,#fff);color:var(--tx);font-size:15px;font-weight:700;line-height:1.4;word-break:break-word}
.item .mid .ur span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.srch{position:relative;margin-bottom:12px}
.srch .i{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.srch input{width:100%;padding:12px 16px 12px 44px;border-radius:999px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);font:inherit;font-size:15px;color:var(--tx)}
#lw.nf .item{animation:none}
.tid{display:none;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.02em;align-self:center;padding-right:2px}
.who{display:flex;align-items:center;gap:12px;min-width:0;margin:0 0 6px;font-size:14px;line-height:1.3}
.wn{flex:none;max-width:50%;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wu{display:flex;align-items:center;gap:4px;min-width:0;color:var(--mut)}
.wu .i{width:14px;height:14px;flex:none}
.wu span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.mt{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;padding:4px 10px 4px 8px;border-radius:999px;background:var(--soft);color:var(--tx);font-size:13px;font-weight:700;line-height:1.3}
.mt .i{width:15px;height:15px;flex:none;color:var(--pri)}
.mt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt.k{background:var(--b,var(--soft));color:var(--t,var(--pri))}
.mt.k .i{color:inherit}
.act{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;background:var(--pri);color:#fff;white-space:nowrap}
.act.alt{background:var(--soft);color:var(--pri)}
.item:hover .act{filter:brightness(1.1)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-weight:700;font-size:14px;cursor:pointer}
.chk input{width:20px;min-height:0;height:20px;padding:0;margin:0;flex:none;accent-color:var(--pri)}
.pw{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap;padding:2px 0 4px}
.pie{width:150px;height:150px;border-radius:50%;flex:none;box-shadow:0 0 0 5px #fff,0 6px 18px rgba(29,37,82,.14)}
.lg{display:grid;gap:12px;min-width:210px;flex:0 1 270px}
.lgi{display:flex;align-items:center;gap:10px}
.lgi i{width:14px;height:14px;border-radius:5px;flex:none}
.lgn{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.25}
.lgn b,.lgv b{font-weight:800;font-size:15px}
.lgn small,.lgv small{font-size:12.5px;color:var(--mut);font-weight:600}
.lgv{display:flex;align-items:baseline;gap:6px}
.rtot{font-size:13px;font-weight:700;color:var(--mut)}
.rtot b{font-size:22px;color:var(--tx);margin-right:4px}
.cat .cn{font-weight:800}
.cat .cp{color:var(--mut);font-weight:700;margin-left:6px;font-size:13px}
.dlst{min-height:20px;margin-top:10px}
/* filter + unduh pada Rincian laporan */
.flt{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px}
.fcard .sec{margin:0 0 12px}
.fcard .srch{margin-bottom:12px}
.fcard .srch input{box-shadow:none;border:1.5px solid #a39c88;background:#fffdf8}
.flt>div{flex:1 1 140px;min-width:0}
.flt label{margin:0 0 5px;font-size:12.5px;font-weight:700;color:var(--mut)}
.flt input,.flt select{min-height:42px;padding:8px 12px;border-radius:12px;font-size:14px}
.flt .frs{flex:0 0 auto;display:flex;align-items:center;min-height:42px}
.dlb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:var(--sh);margin-bottom:14px}
.dlb .dlt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;min-width:0}
.dlb .dln{font-weight:800;font-size:14px;color:var(--tx)}
.dlb .chk{margin:0;font-size:13.5px}
.dlb .acts{flex:0 0 auto;flex-wrap:nowrap}
.dlb .acts .btn{flex:0 0 auto;min-height:40px;padding:8px 18px;font-size:14px}
.dlb .dlst{flex-basis:100%;margin:0;min-height:0}
.dlb .dlst:empty{display:none}
@media(max-width:520px){.dlb .acts{width:100%}.dlb .acts .btn{flex:1 1 0}}
.tw{background:var(--card);border-radius:22px;box-shadow:var(--sh);overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;font-weight:800;color:var(--priT);background:rgba(82,116,218,.09);padding:13px 10px;white-space:nowrap}
.tbl td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:top;min-width:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:rgba(82,116,218,.06)}
.tbl tbody tr td:first-child{box-shadow:inset 4px 0 0 var(--c)}
.tbl .tk{font-size:13px;font-weight:800;white-space:nowrap}
.tbl .wn2{font-weight:800;display:block}
.tbl .wu2{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.tbl .wn2,.tbl .wu2{min-width:100px}
.tbl .ur2{font-size:14px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;word-break:break-word;font-weight:600;min-width:150px}
.tbl .dt{display:block;white-space:nowrap}
.tbl .dt2{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;white-space:nowrap}
.tbl td.ac{text-align:right;white-space:nowrap;padding-right:14px}
.tbl .act{font-size:12px;padding:6px 11px}
@media (max-width:699px){
  .tw{background:transparent;box-shadow:none;border-radius:0;overflow:visible}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tbody tr{background:var(--card);border-radius:18px;box-shadow:var(--sh);margin-bottom:10px;padding:10px 14px 10px 18px;position:relative;overflow:hidden}
  .tbl tbody tr td:first-child{box-shadow:none}
  .tbl tbody tr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .tbl td{display:flex;gap:10px;border:0;padding:5px 0}
  .tbl td::before{content:attr(data-label);flex:0 0 78px;font-size:12px;font-weight:800;color:var(--mut);padding-top:2px}
  .tbl td.ac{justify-content:flex-end;padding-top:8px}
  .tbl td.ac::before{display:none}
  .tbl .ur2{min-width:0}
}
.fbtns{display:flex;gap:10px;flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--priT);background:#fff;color:var(--priT);font:inherit;font-weight:800;font-size:14px;min-height:46px;padding:0 18px;border-radius:999px;cursor:pointer;flex:1 1 150px}
.fbtn.p{background:var(--pri);border-color:var(--pri);color:var(--priTx)}
.fbtn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prevb{position:relative;margin-top:10px}
.prevb img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:14px}
.prevb button{position:absolute;top:8px;right:8px;border:0;border-radius:999px;background:rgba(29,35,64,.82);color:#fff;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.hint{margin:-4px 0 12px;font-size:13px;color:var(--mut)}
.item{grid-template-columns:minmax(0,1fr);padding-left:18px}
.item .end{grid-column:1/-1;display:flex;flex-direction:row;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.item .end .act{margin-left:auto}
.empty{background:var(--card);border-radius:22px;padding:30px 18px;text-align:center;box-shadow:var(--sh)}
.empty .ic{width:52px;height:52px;margin:0 auto 12px;background:#e6ecfc;color:#3858bb}
.empty b{display:block;font-size:16px}

.s-Baru{--b:var(--bg-Baru);--t:var(--tx-Baru);--c:var(--c-Baru)}
.s-Diproses{--b:var(--bg-Diproses);--t:var(--tx-Diproses);--c:var(--c-Diproses)}
.s-Selesai{--b:var(--bg-Selesai);--t:var(--tx-Selesai);--c:var(--c-Selesai)}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:800;background:var(--b);color:var(--t);white-space:nowrap}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--b,var(--soft));color:var(--t,var(--pri));flex:none}
.ic svg{width:22px;height:22px}
.ic.sm{width:40px;height:40px}

/* tiles (rekap) */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:14px}
.tile{border-radius:20px;padding:14px;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:28px;line-height:1;font-weight:800}
.tile span{font-size:13px;font-weight:700;line-height:1.3}
.tile.a{background:var(--pri);color:var(--priTx)}
.tile.b{background:var(--org);color:#3a2a10}
.tile.c{background:var(--red);color:#fff}
.cat{display:flex;align-items:center;gap:12px;padding:10px 0}
.cat+.cat{border-top:1px solid var(--line)}
.cat .cm{flex:1;min-width:0}
.cat .ch{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}

/* detail */
.back{color:#fff;margin:0 0 8px -4px;font-size:15px}
.dgrid{display:grid;gap:14px}
.dgrid>.card{margin-bottom:0}
.th{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.tk{font-size:19px;font-weight:800;word-break:break-all}
.cat-line{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.cat-line b{font-weight:800}
.desc{white-space:pre-wrap;word-break:break-word}
.hl .desc{margin-top:6px;padding:12px 14px;border-left:4px solid var(--c);border-radius:6px 14px 14px 6px;background:var(--b);background:color-mix(in srgb,var(--b) 65%,#fff);font-weight:600;line-height:1.6;max-height:min(50vh,340px);overflow:auto}
.ch2{margin-bottom:14px}
.blk{margin-top:14px}
.blk>b{display:block;margin-bottom:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0 0 16px;padding:14px;background:var(--soft);border-radius:16px}
.kv>div{min-width:0}
.kv dt{font-size:12px;font-weight:700;color:var(--mut)}
.kv dd{margin:2px 0 0;font-weight:700;font-size:14.5px;word-break:break-word;display:flex;align-items:center;gap:6px}
.kv dd svg{width:16px;height:16px;flex:none;color:var(--priT)}

/* forms: underline fields, pill buttons */
label{display:block;font-weight:700;font-size:14px;color:var(--tx);margin:16px 0 6px}
input,select,textarea{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid #a39c88;border-radius:14px;background:#fffdf8;color:var(--tx);font:inherit;outline:0}

var reports=[],tab="admin",sel=null,filt="Semua",q="",PIN="",locked=true,flash="",editing=false;

function $(i){return document.getElementById(i)}
function ico(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
function kic(k){
  k=String(k||"").toLowerCase();
  if(/jaringan|internet|wi-?fi|lan\b/.test(k))return "wifi";
  if(/komputer|laptop|\bpc\b/.test(k))return "pc";
  if(/printer|scanner/.test(k))return "print";
  if(/rapat|audio|visual|proyektor|layar|mikrofon|kamera/.test(k))return "av";
  if(/aplikasi|software|akun|email|website|sistem/.test(k))return "app";
  return "more";
}
function ktone(k){var i=kic(k);return "ck"+({wifi:1,pc:5,print:0,av:3,app:4,more:2}[i]||0)}
function sc(s){return "s-"+String(s).split(" ")[0]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
/* Waktu laporan = kolom createdAt (saat laporan dikirim). Terima angka ms, angka detik, angka berbentuk teks, atau teks tanggal.
   Kosong / 0 / tidak valid -> null (jangan tampil "01 Jan 1970"). */
function ts(t){
  if(t===null||t===undefined||t==="")return null;
  var n=typeof t==="number"?t:(/^\s*\d+(\.\d+)?\s*$/.test(String(t))?Number(t):NaN);
  if(isNaN(n)){n=new Date(t).getTime()}else if(n>0&&n<1e11){n=n*1000}
  return (isNaN(n)||n<=86400000)?null:n;
}
var NODATE="Tanggal tidak tercatat";
function fmt(t){var n=ts(t);return n===null?NODATE:new Date(n).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function fd(t){var n=ts(t);return n===null?NODATE:new Date(n).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})}
function badge(s){return '<span class="badge '+sc(s)+'">'+esc(s)+'</span>'}

var navTo=null;
/* Pindah tab dengan halus: isi lama memudar, lalu isi baru muncul berurutan */
function goTab(t,after){
  var a=$("app"),nav=$("nav");
  if(navTo!==null){navTo=t;return}
  if(t===tab&&!sel){if(after)after();return}
  var run=function(){tab=t;sel=null;flash="";editing=false;navTo=null;render();window.scrollTo(0,0);a.style.minHeight="";a.classList.remove("leave");if(after)after()};
  if(locked||(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)){run();return}
  navTo=t;
  nav.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x.dataset.t===t)});
  a.style.minHeight=a.offsetHeight+"px";
  a.classList.add("leave");
  setTimeout(function(){t=navTo;run()},170);
}
function render(){
  var nav=$("nav"),a=$("app");
  if(locked){nav.innerHTML="";a.innerHTML=vLogin();bindLogin();return}
  var tabs=[["admin","Dashboard","home"],["rekap","Rincian Laporan","chart"],["pegawai","Pegawai","user"]];
  nav.innerHTML=tabs.map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" data-t="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+ico(t[2])+'<span>'+t[1]+'</span></button>'}).join("");
  nav.querySelectorAll("button").forEach(function(b){b.onclick=function(){goTab(b.dataset.t)}});
  document.body.classList.toggle("wide",!sel);
  a.innerHTML=(tab==="admin"?vAdmin():tab==="pegawai"?vPegawai():vRekap());
  bind();
}

function greet(){var h=new Date().getHours();return h<4?"Selamat malam":h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam"}
function ago(t){
  var n=ts(t);if(n===null)return "Tgl. tidak tercatat";
  var d=Date.now()-n;if(d<0)d=0;
  var m=Math.floor(d/60000);
  if(m<1)return "Baru saja";
  if(m<60)return m+" menit lalu";
  var h=Math.floor(m/60);if(h<24)return h+" jam lalu";
  var dd=Math.floor(h/24);if(dd===1)return "Kemarin";if(dd<7)return dd+" hari lalu";
  return fd(t);
}
var fPeg="";
function namaPeg(v){return String(v||"").split(",").map(function(x){return x.trim()}).filter(Boolean)}
function pegCocok(r){
  if(!fPeg)return true;

/* Pilihan nama: daftar pegawai ditambah nama yang pernah tercatat di laporan */
function pegOpsi(){
  var seen={},out=[];
  PEGAWAI.concat.apply(PEGAWAI,reports.map(function(r){return namaPeg(r.pegawai)})).forEach(function(n){
    n=String(n).trim();var k=n.toLowerCase();
    if(n&&!seen[k]){seen[k]=1;out.push(n)}
  });
  return out.sort(function(a,b){return a.localeCompare(b)});
}
function tglCocok(r){
  if(!fDari&&!fSampai)return true;
  var n=ts(r.createdAt);if(n===null)return false;
  var d1=fDari?new Date(fDari+"T00:00:00").getTime():null,d2=fSampai?new Date(fSampai+"T23:59:59.999").getTime():null;
  return (d1===null||n>=d1)&&(d2===null||n<=d2);
}
function hit(r){
  if(!tglCocok(r)||!pegCocok(r))return false;
  var t=q.trim().toLowerCase();if(!t)return true;
  var h=[r.id,r.nama,r.unit,r.kategori,r.deskripsi,r.status,r.solusi].join(" ").toLowerCase();
  return t.split(/\s+/).every(function(w){return h.indexOf(w)>=0});
}

  if(!uri)return res(null);

    try{
      var sc=Math.min(1,640/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
      var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");

      if(i%2)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:ZEBRA}};
    });
    if(withFoto){
      ["foto","bukti"].forEach(function(k){
        var im=f[k],c0=ci(k);
        if(!im)return;
        var z=fitBox(im.w,im.h,200,150),id=wb.addImage({buffer:im.u8,extension:"jpeg"});
        ws.addImage(id,{tl:{col:c0+(215-z.w)/2/215,row:row.number-1+4/Math.max(z.h+8,1)},ext:{width:z.w,height:z.h}});
        ph=Math.max(ph,z.h+10);
      });
    }
    row.height=Math.max(32,lines*15,ph*0.75);
  });
  ws.autoFilter={from:{row:1,column:1},to:{row:1,column:cols.length}};
  var w2=wb.addWorksheet("Rekap Kategori");
  w2.columns=[{header:"Kategori",width:28},{header:"Baru",width:11},{header:"Diproses",width:11},{header:"Selesai",width:11},{header:"Total",width:11}];
  w2.getRow(1).eachCell(function(c){c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF4562CD"}};c.alignment={horizontal:"center",vertical:"middle"};c.border=bd});
  var tot=[0,0,0,0];
  rekapKS(list).forEach(function(x){var rw=w2.addRow(x);rw.eachCell(function(c,n){c.border=bd;if(n>1)c.alignment={horizontal:"center"}});for(var k=0;k<4;k++)tot[k]+=x[k+1]});
  var tr=w2.addRow(["Total"].concat(tot));tr.eachCell(function(c,n){c.font={bold:true};c.border=bd;c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE6ECFC"}};if(n>1)c.alignment={horizontal:"center"}});
  return wb.xlsx.writeBuffer().then(function(buf){return new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})});
}

function buatWord(list,fotos,withFoto,info){
  var D=docx,F="Times New Roman",NAVY="1F3A6E",LINE="8C96B4",ZEBRA="F3F5FA";
  var bd={style:D.BorderStyle.SINGLE,size:4,color:LINE},bds={top:bd,bottom:bd,left:bd,right:bd};
  function runs(t,o){o=o||{};var ls=String(t==null?"":t).split(/\r?\n/);return ls.map(function(l,i){return new D.TextRun({text:l,break:i?1:0,bold:!!o.bold,italics:!!o.it,size:o.size||20,color:o.color,font:F,language:{value:"id-ID"}})})}
  function par(t,o){o=o||{};return new D.Paragraph({children:runs(t,o),alignment:o.align,spacing:{after:o.after===undefined?0:o.after,before:o.before||0,line:o.line||264},border:o.border})}
  function cell(ch,w,o){o=o||{};return new D.TableCell({children:ch,width:{size:w,type:D.WidthType.DXA},borders:bds,margins:{top:80,bottom:80,left:90,right:90},verticalAlign:o.v||D.VerticalAlign.TOP,
    shading:o.fill?{type:D.ShadingType.CLEAR,fill:o.fill,color:"auto"}:undefined})}
  function head(t,w){return cell([par(t,{bold:true,color:"FFFFFF",align:D.AlignmentType.CENTER,size:20})],w,{fill:NAVY,v:D.VerticalAlign.CENTER})}
  function tglP(t){var n=ts(t);return n===null?"-":new Date(n).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Makassar"})}
  function jamP(t){var n=ts(t);return n===null?"":new Date(n).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Makassar"}).replace(":",".")+" WITA"}
  /* Lebar total 10206 DXA = A4 dengan margin 1,5 cm kiri-kanan */
  var W=withFoto?[440,1200,1250,2100,1850,1516,1850]:[500,1400,1500,4306,2500];
  var H=withFoto?["No","Tanggal Lapor","Nama Pelapor","Uraian Kendala","Foto Kendala","Solusi","Foto Bukti Selesai"]:["No","Tanggal Lapor","Nama Pelapor","Uraian Kendala","Solusi"];
  var rows=[new D.TableRow({tableHeader:true,cantSplit:true,children:H.map(function(h,i){return head(h,W[i])})})];
  function imgCell(im,w,fill,kosong){
    if(!im)return cell([par(kosong||"Tidak ada foto",{align:D.AlignmentType.CENTER,color:"8A8FA8",it:true,size:18})],w,{fill:fill,v:D.VerticalAlign.CENTER});
    var z=fitBox(im.w,im.h,Math.round((w-180)/15),170);
    return cell([new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.ImageRun({data:im.u8,transformation:{width:z.w,height:z.h}})]})],w,{fill:fill,v:D.VerticalAlign.CENTER});
  }
  list.forEach(function(r,i){
    var f=fotos[r.id]||{},fill=i%2?ZEBRA:undefined;
    var sol=r.solusi?[par(r.solusi)]:[par("-",{align:D.AlignmentType.CENTER,color:"8A8FA8"})];
    var c=[
      cell([par(i+1,{align:D.AlignmentType.CENTER})],W[0],{fill:fill}),
      cell([par(tglP(r.createdAt),{bold:true}),par(jamP(r.createdAt),{color:"5B6075",size:18,before:20})],W[1],{fill:fill}),
      cell([par(r.nama,{bold:true})],W[2],{fill:fill}),
      cell([par(r.deskripsi,{align:D.AlignmentType.LEFT})],W[3],{fill:fill})];
    if(withFoto)c.push(imgCell(f.foto,W[4],fill));
    c.push(cell(sol,W[withFoto?5:4],{fill:fill}));
    if(withFoto)c.push(imgCell(f.bukti,W[6],fill,"Belum ada bukti"));
    rows.push(new D.TableRow({children:c}));
  });
  var main=new D.Table({width:{size:10206,type:D.WidthType.DXA},columnWidths:W,rows:rows});
  var tgl=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Makassar"});
  var selesai=list.filter(function(r){return r.solusi}).length;
  var garis={bottom:{style:D.BorderStyle.DOUBLE,size:6,color:NAVY,space:6}};
  var foot=new D.Footer({children:[new D.Paragraph({alignment:D.AlignmentType.CENTER,
    border:{top:{style:D.BorderStyle.SINGLE,size:4,color:LINE,space:6}},
    children:[new D.TextRun({text:"Layanan Prakom  |  Halaman ",font:F,size:18,color:"5B6075"}),
      new D.TextRun({children:[D.PageNumber.CURRENT],font:F,size:18,color:"5B6075"}),
      new D.TextRun({text:" dari ",font:F,size:18,color:"5B6075"}),
      new D.TextRun({children:[D.PageNumber.TOTAL_PAGES],font:F,size:18,color:"5B6075"})]})]});
  var d=new D.Document({
    creator:"Layanan Prakom",title:"Laporan Pekerjaan Layanan Prakom",
    styles:{default:{document:{run:{font:F,size:20}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1134,bottom:1134,left:850,right:850,footer:567}}},
      footers:{default:foot},
      children:[
        par("LAPORAN PEKERJAAN",{bold:true,size:32,align:D.AlignmentType.CENTER,color:NAVY}),
        par("LAYANAN PRAKOM",{bold:true,size:32,align:D.AlignmentType.CENTER,color:NAVY,after:60}),
        par("BLSDM Komdigi Manado",{size:24,align:D.AlignmentType.CENTER,after:120,border:garis}),
        par("Dicetak pada "+tgl+"   |   Total "+list.length+" laporan   |   Sudah ada solusi "+selesai+" laporan",{size:20,align:D.AlignmentType.CENTER,color:"5B6075",before:160,after:info?40:240})].concat(info?[par(info,{size:20,align:D.AlignmentType.CENTER,color:"5B6075",bold:true,after:240})]:[]).concat([main])}]
  });
  return D.Packer.toBlob(d);
}

function unduh(jenis){
  var hasilFoto={};
  var st=$("dl-st"),bt=[$("dl-xlsx"),$("dl-docx")],withFoto=$("dl-foto").checked;
  var set=function(t){if(st)st.textContent=t};
  bt.forEach(function(b){if(b)b.disabled=true});
  if(dlRentangSalah()){set("Tanggal awal tidak boleh setelah tanggal akhir.");bt.forEach(function(b){if(b)b.disabled=false});return}
  var list=dlList();
  if(!list.length){set(reports.length?"Tidak ada laporan yang sesuai filter.":"Belum ada laporan untuk diunduh.");bt.forEach(function(b){if(b)b.disabled=false});return}
  set("Menyiapkan…");
  loadLib(jenis)
    .then(function(){return withFoto?ambilFoto(list,function(d,n){set("Mengambil foto "+d+" dari "+n+" tiket…")},true):null})
    .then(function(){set("Menyiapkan foto…");return siapFoto(list,withFoto,true)})
    .then(function(fotos){hasilFoto=fotos;return jenis==="xlsx"?buatExcel(list,fotos,withFoto):buatWord(list,fotos,withFoto,dlInfo())})
    .then(function(blob){
      simpanBlob(blob,"laporan-pekerjaan-prakom-"+tglCsv()+(filt!=="Semua"?"-"+filt.toLowerCase():"")+(jenis==="xlsx"?".xlsx":".docx"));
      var gagal=[],total=0;
      if(withFoto)list.forEach(function(r){["foto","bukti"].forEach(function(k){if(r[k]){total++;if(!(hasilFoto[r.id]&&hasilFoto[r.id][k]))gagal.push(r)}})});
      if(!gagal.length)return set("Selesai. File sudah diunduh beserta foto.");
      var f0=FOTO[gagal[0].id]||{};
      return set("File diunduh, tetapi "+gagal.length+" dari "+total+" foto (kendala/bukti) tidak bisa diambil"+(f0.err?". Alasan dari server: "+f0.err:". Foto tidak terbaca dari server maupun dari Drive")+". Pastikan fungsi adminFoto sudah ditambahkan di Apps Script dan sudah Deploy New version.");
    })
    .catch(function(e){set("Gagal: "+(e&&e.message||e))})
    .then(function(){bt.forEach(function(b){if(b)b.disabled=false})});
}
